<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consulta Legal Gratuita</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400..900;1,400..900&family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="page">
    <header class="topbar">
      <span class="topbar-brand">CONSULTA PROFESIONAL GRATUITA</span>
    </header>

    <section class="hero">
      <h1 class="hero-title">SOLUCIONES EN <span class="hero-title-accent">MINUTOS</span></h1>
    </section>

    <section class="form-section">
      <p class="form-kicker">Un abogado revisará tu caso sin costo</p>
      <h2 class="form-title">Solicita tu asesoría gratuita</h2>

      <form id="lead-form" class="lead-form" novalidate>
        <div class="field">
          <label for="nombre">Nombre completo</label>
          <input type="text" id="nombre" name="nombre" autocomplete="name" placeholder="Ej. Juan Pérez" required>
        </div>

        <div class="field">
          <label for="correo">Correo electrónico (opcional)</label>
          <input type="email" id="correo" name="correo" autocomplete="email" placeholder="tucorreo@ejemplo.com">
        </div>

        <div class="field">
          <label for="telefono">Número telefónico</label>
          <div class="phone-group">
            <select id="lada" name="lada" aria-label="Código de país">
              <option value="+52">+52</option>
              <option value="+1">+1</option>
            </select>
            <input type="tel" id="telefono" name="telefono" autocomplete="tel" placeholder="(555) 123 4567" required>
          </div>
        </div>

        <button type="submit" id="submit-btn">Quiero mi consulta GRATIS</button>

        <p id="form-status" class="form-status" role="status" aria-live="polite"></p>
      </form>
    </section>

    <footer class="footer">
      <p class="footer-confidential">100% Confidencial · Sin compromiso</p>
      <p>© <span id="year"></span> Servicios Profesionales. Todos los derechos reservados.</p>
    </footer>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
