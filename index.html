<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Regístrate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400..900;1,400..900&family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="page">
    <header class="topbar">
      <span class="topbar-side">Regístrate hoy</span>
      <span class="topbar-brand">LOGIC</span>
      <span class="topbar-side">Cupos limitados</span>
    </header>

    <section class="hero">
      <h1 class="hero-title">ÚNETE</h1>
    </section>

    <section class="form-section">
      <p class="form-kicker">Déjanos tus datos</p>
      <h2 class="form-title">Reserva tu lugar</h2>

      <form id="lead-form" class="lead-form" novalidate>
        <div class="field">
          <label for="nombre">Nombre completo</label>
          <input type="text" id="nombre" name="nombre" autocomplete="name" placeholder="Ej. Juan Pérez" required>
        </div>

        <div class="field">
          <label for="correo">Correo electrónico</label>
          <input type="email" id="correo" name="correo" autocomplete="email" placeholder="tucorreo@ejemplo.com" required>
        </div>

        <div class="field">
          <label for="telefono">Número telefónico</label>
          <input type="tel" id="telefono" name="telefono" autocomplete="tel" placeholder="+52 55 1234 5678" required>
        </div>

        <button type="submit" id="submit-btn">Enviar</button>

        <p id="form-status" class="form-status" role="status" aria-live="polite"></p>
      </form>
    </section>

    <footer class="footer">
      <p>© <span id="year"></span> LOGIC. Todos los derechos reservados.</p>
    </footer>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
